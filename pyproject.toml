[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auto-zettelkasten"
version = "0.11.0"
description = "Turn a Zotero library into validated atomic notes, literature maps, and an Obsidian-ready vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Khalil Alwazir" }]
keywords = ["zotero", "zettelkasten", "obsidian", "research", "literature-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pypdf>=4.0",
  "pypdfium2>=5.4",
]

[project.scripts]
auto-zettelkasten = "auto_zettelkasten.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/Khilo65/auto-zettelkasten"
Repository = "https://github.com/Khilo65/auto-zettelkasten"
Issues = "https://github.com/Khilo65/auto-zettelkasten/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_zettelkasten"]

[tool.pytest.ini_options]
addopts = "-q -W error::ResourceWarning"
testpaths = ["tests"]
