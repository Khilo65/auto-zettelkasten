[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auto-zettelkasten"
version = "0.30.0"
description = "Turn a Zotero library into validated atomic notes, literature maps, and an Obsidian-ready vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Khalil Alwazir" }]
keywords = ["zotero", "zettelkasten", "obsidian", "research", "literature-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pypdf>=4.0",
  "pypdfium2>=5.4",
]

[project.scripts]
auto-zettelkasten = "auto_zettelkasten.cli:main"

[project.gui-scripts]
auto-zettelkasten-desktop = "auto_zettelkasten.desktop:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "build>=1.2"]
desktop = ["pywebview>=6.0,<7", "certifi>=2024.8.30"]
desktop-build = ["pyinstaller>=6.0,<7"]
local-mapping = [
  "numpy>=1.26,<3",
  "sentence-transformers>=3.0,<6",
  "torch>=2.2,<3",
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
]
local-mapping-hdbscan = ["hdbscan>=0.8.33,<1"]

[project.urls]
Homepage = "https://github.com/Khilo65/auto-zettelkasten"
Repository = "https://github.com/Khilo65/auto-zettelkasten"
Issues = "https://github.com/Khilo65/auto-zettelkasten/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_zettelkasten"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tools/desktop_entry.py",
  "/tools/build_desktop.py",
  "/tools/build_web.mjs",
  "/tools/build_zotero_reader.py",
  "/tools/build_zotero_companion.py",
  "/zotero-companion",
  "/third_party/zotero-reader",
  "/tools/web_entry.js",
  "/tools/workspace_links.js",
  "/package.json",
  "/package-lock.json",
  "/docs/DESKTOP.md",
  "/docs/JEV_RELATIONSHIPS.md",
  "/docs/LOCAL_DISCOVERY.md",
  "/docs/LOCAL_MAPPING.md",
]

[tool.pytest.ini_options]
addopts = "-q -W error::ResourceWarning"
testpaths = ["tests"]
