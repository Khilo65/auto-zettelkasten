name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - name: Enforce standalone import boundary
        run: |
          python -m pytest tests/test_api_cli_architecture.py::test_package_has_no_research_os_imports
      - run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/auto-zettelkasten-wheel
          /tmp/auto-zettelkasten-wheel/bin/python -m pip install dist/*.whl
          /tmp/auto-zettelkasten-wheel/bin/auto-zettelkasten --help
          /tmp/auto-zettelkasten-wheel/bin/python -c "import importlib.metadata, auto_zettelkasten; declared = importlib.metadata.version('auto-zettelkasten'); assert auto_zettelkasten.ENGINE_VERSION == declared, f'ENGINE_VERSION {auto_zettelkasten.ENGINE_VERSION!r} disagrees with package metadata {declared!r}'"
